<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ratings | MessHub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body id="ratings">
  <header>
    <div class="wrap">
      <a class="logo" href="index.html"><img src="assets/images/bennett-logo.png" alt="Bennett University logo"><span>MessHub</span></a>
      <nav>
      <a href="index.html">Today</a>
      <a href="menu.html">Weekly menu</a>
      <a href="feedback.html">Rate a meal</a>
      <a href="ratings.html" class="active">Ratings</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <h1>Meal ratings</h1>
      <p class="lead">Average rating for each meal from the feedback saved in this browser.</p>
      <p class="big" id="overall"></p>
      <p id="total"></p>
      <section><h2>Average by meal</h2><div id="bars"></div></section>
      <section>
        <h2>Latest comments</h2>
        <ul class="list" id="recent"></ul>
        <div class="row">
          <button class="btn light" id="sample">Load sample feedback</button>
          <button class="btn light" id="clear">Clear all</button>
        </div>
      </section>
    </div>
  </main>
  <footer>
    <div class="wrap">MessHub - Web Development mini-project, Bennett University.</div>
  </footer>
</body>
</html>
